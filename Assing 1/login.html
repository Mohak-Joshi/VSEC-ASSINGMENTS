<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;

            /* BACKGROUND IMAGE */
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcEOilQL_IwXnKx7v-jfza2HZYhDcPetjm9SVC7O62gQ&s=10");
            background-size: cover;
            background-position: center;
        }

        /* Navigation Bar */
        .navbar {
            background-color: black;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }

        .navbar a:hover {
            color: lightblue;
        }

        /* Login Box */
        .login {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: white;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 30px;
            background-color: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <div class="navbar">

        <a href="home.html">Home</a>

        <a href="login.html">Login</a>

        <a href="about.html">About</a>

        <a href="contact.html">Contact</a>

    </div>


    <!-- Login -->
    <div class="login">

        <h2>Login</h2>

        <input type="text" placeholder="Username">

        <input type="password" placeholder="Password">

        <br>

        <button>Login</button>

    </div>

</body>

</html>
